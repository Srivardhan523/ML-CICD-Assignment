<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ML CI/CD Assignment — Deployment</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 16px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      backdrop-filter: blur(10px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #818cf8, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .info-item {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(99, 102, 241, 0.15);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .info-item.full-width {
      grid-column: 1 / -1;
    }

    .info-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #64748b;
      margin-bottom: 8px;
    }

    .info-value {
      font-size: 1.3rem;
      font-weight: 600;
      color: #e2e8f0;
    }

    .info-value.accuracy {
      font-size: 2rem;
      background: linear-gradient(135deg, #34d399, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(99, 102, 241, 0.15);
      color: #475569;
      font-size: 0.8rem;
    }

    .footer a {
      color: #818cf8;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>🤖 ML CI/CD Assignment</h1>
      <p>Automated Machine Learning Pipeline with GitHub Actions</p>
    </div>

    <div class="info-grid">
      <div class="info-item">
        <div class="info-label">ML Model</div>
        <div class="info-value">Random Forest</div>
      </div>
      <div class="info-item">
        <div class="info-label">Dataset</div>
        <div class="info-value">Iris</div>
      </div>
      <div class="info-item full-width">
        <div class="info-label">Model Accuracy</div>
        <div class="info-value accuracy">100.0%</div>
      </div>
      <div class="info-item full-width">
        <div class="info-label">CI/CD Deployment Status</div>
        <div>
          <span class="status-badge">
            <span class="status-dot"></span>
            ✅ Deployed Successfully via GitHub Actions
          </span>
        </div>
      </div>
    </div>

    <div class="footer">
      <p>Deployed automatically by the CD pipeline &bull;
        <a href="https://github.com" target="_blank">View Repository</a>
      </p>
    </div>
  </div>
</body>
</html>
